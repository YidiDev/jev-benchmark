[project]
name = "jev-benchmark"
version = "0.1.0"
description = "Rubric-Based Zero-Shot Classification Model Benchmark: Jev vs NLI vs embeddings vs Claude Haiku 4.5 vs Claude Sonnet 5 vs OpenJev on rubric-conditioned document sorting, chained decision execution, and partial-credit exam grading."
readme = "README.md"
license = "MIT"
authors = [{ name = "Yidi Sprei" }]
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.1.0",
    "anthropic>=0.40.0",
    "transformers>=4.45.0",
    "sentence-transformers>=3.2.0",
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0",
    "rich>=13.8.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corpus", "rubrics", "arms", "harness", "qtree", "examgrade"]
